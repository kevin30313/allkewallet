spring.jpa.hibernate.ddl-auto=update

# Configuración del datasource (100% vía variables de entorno)
spring.datasource.url=${ACCOUNT_DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${ACCOUNT_DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://alkewallet-frontend-1041045148793.us-central1.run.app}
